name: Daily CSE Market Sync & Data Quality Audit

on:
  schedule:
    # 09:30 UTC = 15:00 Colombo Time (UTC+5:30), 30 minutes after CSE market close
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily CSE Market Sync & Quality Audit
        run: |
          python scripts/daily_market_sync.py

      - name: Run Quality Verification Tests
        run: |
          pytest -v tests/test_features.py tests/test_api.py

      - name: Commit & Push Processed Parquet Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet
          git commit -m "chore(data): auto-sync daily CSE market session and ASPI index [skip ci]" || exit 0
          git push
