name: Daily CSE Market Sync & Retraining

on:
  schedule:
    # 09:30 UTC = 15:00 SLST (Colombo Time) Monday through Friday
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  daily-mlops-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Ingestion, Retrain & Prediction
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: |
          python scripts/daily_pipeline_job.py

      - name: Trigger Render Deployment (Optional)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK"
